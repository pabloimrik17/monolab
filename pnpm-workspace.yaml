packages:
    - apps/*
    - packages/*
    - claude-plugins/*

allowBuilds:
    # builds/links native FS-watcher binary (prebuilt + node-gyp fallback); nx watch/daemon use it. safe + needed -> allow
    "@parcel/watcher": true
    # postinstall sets up the native SWC compiler binding; used by @swc-node/register (nx) + fast transpile. safe + needed -> allow
    "@swc/core": true
    # postinstall installs the native esbuild binary; used by vite/vitest. safe + needed -> allow
    esbuild: true
    # postinstall builds nx native bindings (hashing/daemon); core monorepo tool. safe + needed -> allow
    nx: true
    # postinstall runs `msw init` only when a package sets msw.workerDirectory (none here) -> no-op. not needed -> deny
    msw: false
    # ships prebuilt platform binaries, no install hook -> nothing to build. not needed -> deny
    oxc-resolver: false

blockExoticSubdeps: true

strictPeerDependencies: false
autoInstallPeers: true

catalog:
    "@vitest/coverage-v8": 4.1.9
    "@vitest/ui": 4.1.9
    vite-tsconfig-paths: 5.1.4
    vitest: 4.1.9

minimumReleaseAge: 1440

patchedDependencies:
    "@codecov/sveltekit-plugin@2.0.1": patches/@codecov__sveltekit-plugin@2.0.1.patch

packages:
    - apps/*
    - packages/*
    - claude-plugins/*

allowBuilds:
    # builds from source only if npm_config_build_from_source is set; not needed (prebuilt binaries)
    "@parcel/watcher": false
    # postinstall only checks the native binding; not needed (prebuilt @swc/core-* on every platform)
    "@swc/core": false
    # postinstall only swaps in the native binary as a speed-up; not needed (@esbuild/* prebuilt)
    esbuild: false
    # postinstall pre-fetches the Nx Cloud client; not needed (@nx/nx-* prebuilt, client fetched on demand)
    nx: false
    # postinstall only acts when msw.workerDirectory is set; not needed (unset here)
    msw: false
    # node-gyp build of ssh2's optional CPU probe; not needed (ssh2 falls back without it)
    cpu-features: false
    # only warns on a version-scheme mismatch; not needed
    protobufjs: false
    # node-gyp build of an optional crypto binding; not needed (pure-JS fallback)
    ssh2: false
    # postinstall only checks the native binding; not needed (prebuilt @unrs/resolver-binding-* on every platform)
    unrs-resolver: false

blockExoticSubdeps: true

trustPolicy: no-downgrade

trustPolicyExclude:
    # Maintainer published 4.0.2/4.0.3 locally (no provenance); tarball matches upstream tag, no advisories
    - chokidar@4.0.3
    # Backport of the ReDoS fix to the 6.x line, published without provenance; tarball identical to upstream tag v6.3.1
    - semver@6.3.1
    # Maintainer arcanis published 3.2.2 by hand (no provenance); tarball matches upstream berry 2eb98307, no advisories
    - "@yarnpkg/libzip@3.2.2"

strictDepBuilds: true

strictPeerDependencies: false

overrides:
    # Browserslist advisory groups in Babel compilation targets and core-js-compat.
    "@babel/helper-compilation-targets@7>browserslist": 4.28.7
    "@babel/helper-compilation-targets@8.0.7>browserslist": 4.28.7
    "core-js-compat@3.45.0>browserslist": 4.28.7
    # fast-uri advisory groups in Ajv schema validation.
    "ajv@8>fast-uri": 3.1.7
    # js-yaml advisory groups in Cosmiconfig config loading.
    "cosmiconfig@8.3.6>js-yaml": 4.3.2
    "cosmiconfig@9.0.2>js-yaml": 4.3.2
    # minimatch 5 and 9 advisory groups in archive file matching.
    "glob@10.5.0>minimatch": 9.0.9
    "readdir-glob@1.1.3>minimatch": 5.1.8
    # brace-expansion 2 and 5 advisory groups in minimatch.
    "minimatch@5.1.8>brace-expansion": 2.1.6
    "minimatch@9.0.9>brace-expansion": 2.1.6
    "minimatch@10.2.5>brace-expansion": 5.0.12
    "minimatch@10.2.6>brace-expansion": 5.0.12
    # follow-redirects advisory groups in the Vinxi HTTP proxy.
    "http-proxy@1.18.1>follow-redirects": 1.16.2
    # Babel SystemJS transform advisory group in Nx's preset-env.
    "@nx/js@23.3.0>@babel/preset-env": 7.29.5
    # picomatch 2 advisory groups in file matching and watching.
    "anymatch@3.1.3>picomatch": 2.3.2
    "micromatch@4.0.8>picomatch": 2.3.2
    # Undici 6 and 8 advisory groups in Actions clients and Testcontainers.
    "@actions/github@9.1.1>undici": 6.29.1
    "@actions/http-client@3.0.2>undici": 6.29.1
    "@actions/http-client@4.0.1>undici": 6.29.1
    "testcontainers@12.2.1>undici": 8.12.2

catalog:
    "@arethetypeswrong/cli": 0.18.5
    "@codecov/rollup-plugin": 2.0.1
    "@codecov/vite-plugin": 2.0.1
    "@stryker-mutator/api": 10.1.1
    "@stryker-mutator/core": 10.1.1
    "@stryker-mutator/typescript-checker": 10.1.1
    "@stryker-mutator/vitest-runner": 10.1.1
    "@testcontainers/postgresql": 12.2.0
    "@testcontainers/redis": 12.2.0
    "@types/node": 24.19.2
    "@types/pg": 8.20.0
    "@types/react": 19.2.17
    "@varlock/1password-plugin": 2.0.4
    "@varlock/vite-integration": 1.5.2
    "@vitejs/plugin-react-swc": 4.3.3
    "@vitest/browser-playwright": 5.1.0
    "@vitest/coverage-v8": 5.1.0
    "@vitest/eslint-plugin": 1.6.28
    "@vitest/ui": 5.1.0
    drizzle-kit: 0.31.10
    drizzle-orm: 0.45.2
    inversify: 8.2.3
    ioredis: 5.11.1
    msw: 3.0.4
    neverthrow: 8.2.0
    pg: 8.22.0
    react: 19.2.7
    react-dom: 19.2.7
    solid-js: 1.9.14
    tsdown: 0.22.9
    tslib: 2.8.1
    typescript: 6.0.3
    varlock: 1.21.0
    vite: 8.1.6
    vite-plugin-solid: 2.11.12
    vitest: 5.1.0
    vitest-browser-react: 2.3.0

minimumReleaseAge: 1440

patchedDependencies:
    "@codecov/sveltekit-plugin@2.0.1": patches/@codecov__sveltekit-plugin@2.0.1.patch

permissions:
    fallow:
        skills: true
    varlock:
        skills: true
minimumReleaseAgeExclude:
    # Renovate security update: vite@8.1.6
    - vite@8.1.6
    # Renovate security update: react-router@8.3.0
    - react-router@8.3.0
    # Renovate security update: postcss@8.5.23
    - postcss@8.5.23
    # Renovate security update: nx@23.2.1
    - nx@23.2.1

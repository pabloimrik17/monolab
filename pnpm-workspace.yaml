packages:
    - apps/*
    - packages/*
    - claude-plugins/*

allowBuilds:
    # builds the native FS-watcher from source if no prebuilt; needed for nx watch/daemon
    "@parcel/watcher": true
    # postinstall links the native SWC binding; needed by @swc-node/register (nx) transpile
    "@swc/core": true
    # postinstall validates/links the native esbuild binary; needed by vite/vitest
    esbuild: true
    # postinstall sets up nx native bindings (hashing/daemon); needed to run nx
    nx: true
    # postinstall runs `msw init` only if msw.workerDirectory is set; not needed (unset here)
    msw: false
    # no install script, ships prebuilt binaries; not needed (nothing to build)
    oxc-resolver: false
    # node-gyp build of an optional ssh2 addon; not needed (pure-JS fallback, no ssh)
    cpu-features: false
    # postinstall only patches a version-scheme check; not needed (no runtime effect)
    protobufjs: false
    # install.js builds optional native crypto speed-up; not needed (docker socket, no ssh)
    ssh2: false

strictPeerDependencies: false

catalog:
    "@arethetypeswrong/cli": 0.18.5
    "@codecov/rollup-plugin": 2.0.1
    "@codecov/vite-plugin": 2.0.1
    "@stryker-mutator/api": 9.6.1
    "@stryker-mutator/core": 9.6.1
    "@stryker-mutator/typescript-checker": 9.6.1
    "@stryker-mutator/vitest-runner": 9.6.1
    "@testcontainers/postgresql": 12.2.0
    "@testcontainers/redis": 12.2.0
    "@types/node": 24.19.2
    "@types/pg": 8.20.0
    "@types/react": 19.2.17
    "@varlock/1password-plugin": 2.0.4
    "@varlock/vite-integration": 1.5.2
    "@vitejs/plugin-react-swc": 4.3.1
    "@vitest/browser-playwright": 4.1.10
    "@vitest/coverage-v8": 4.1.10
    "@vitest/ui": 4.1.10
    drizzle-kit: 0.31.10
    drizzle-orm: 0.45.2
    inversify: 8.2.3
    ioredis: 5.11.1
    msw: 2.15.0
    neverthrow: 8.2.0
    pg: 8.22.0
    react: 19.2.7
    react-dom: 19.2.7
    solid-js: 1.9.14
    tsdown: 0.22.9
    tslib: 2.8.1
    typescript: 6.0.3
    varlock: 1.21.0
    vite: 8.1.5
    vite-plugin-solid: 2.11.12
    vitest: 4.1.10
    vitest-browser-react: 2.2.0

minimumReleaseAge: 1440

patchedDependencies:
    "@codecov/sveltekit-plugin@2.0.1": patches/@codecov__sveltekit-plugin@2.0.1.patch

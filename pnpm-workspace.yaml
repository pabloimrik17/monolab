packages:
    - apps/*
    - packages/*
    - claude-plugins/*

allowBuilds:
    # builds/links native FS-watcher binary (prebuilt + node-gyp fallback); nx watch/daemon use it. safe + needed -> allow
    "@parcel/watcher": true
    # postinstall sets up the native SWC compiler binding; used by @swc-node/register (nx) + fast transpile. safe + needed -> allow
    "@swc/core": true
    # postinstall installs the native esbuild binary; used by vite/vitest. safe + needed -> allow
    esbuild: true
    # postinstall builds nx native bindings (hashing/daemon); core monorepo tool. safe + needed -> allow
    nx: true
    # postinstall runs `msw init` only when a package sets msw.workerDirectory (none here) -> no-op. not needed -> deny
    msw: false
    # ships prebuilt platform binaries, no install hook -> nothing to build. not needed -> deny
    oxc-resolver: false

blockExoticSubdeps: true

strictPeerDependencies: false
autoInstallPeers: true

catalog:
    "@arethetypeswrong/cli": 0.18.5
    "@codecov/rollup-plugin": 2.0.1
    "@codecov/vite-plugin": 2.0.1
    "@stryker-mutator/api": 9.6.1
    "@stryker-mutator/core": 9.6.1
    "@stryker-mutator/typescript-checker": 9.6.1
    "@stryker-mutator/vitest-runner": 9.6.1
    "@types/node": 24.13.3
    "@types/react": 19.2.17
    "@vitejs/plugin-react-swc": 4.3.1
    "@vitest/browser-playwright": 4.1.10
    "@vitest/coverage-v8": 4.1.10
    "@vitest/ui": 4.1.10
    drizzle-kit: 0.31.10
    drizzle-orm: 0.45.2
    inversify: 8.2.1
    ioredis: 5.11.1
    neverthrow: 8.2.0
    pg: 8.22.0
    react: 19.2.7
    react-dom: 19.2.7
    solid-js: 1.9.14
    tsdown: 0.22.9
    tslib: 2.8.1
    typescript: 6.0.3
    vite: 8.1.5
    vite-plugin-solid: 2.11.12
    vitest: 4.1.10
    vitest-browser-react: 2.2.0

minimumReleaseAge: 1440

patchedDependencies:
    "@codecov/sveltekit-plugin@2.0.1": patches/@codecov__sveltekit-plugin@2.0.1.patch

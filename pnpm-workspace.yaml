packages:
  - apps/*
  - packages/*
  - claude-plugins/*

allowBuilds:
  # builds from source only if npm_config_build_from_source is set; not needed (prebuilt binaries)
  "@parcel/watcher": false
  # postinstall only checks the native binding; not needed (prebuilt @swc/core-* on every platform)
  "@swc/core": false
  # postinstall only swaps in the native binary as a speed-up; not needed (@esbuild/* prebuilt)
  esbuild: false
  # postinstall pre-fetches the Nx Cloud client; not needed (@nx/nx-* prebuilt, client fetched on demand)
  nx: false
  # postinstall only acts when msw.workerDirectory is set; not needed (unset here)
  msw: false
  # node-gyp build of ssh2's optional CPU probe; not needed (ssh2 falls back without it)
  cpu-features: false
  # only warns on a version-scheme mismatch; not needed
  protobufjs: false
  # node-gyp build of an optional crypto binding; not needed (pure-JS fallback)
  ssh2: false
  # postinstall only checks the native binding; not needed (prebuilt @unrs/resolver-binding-* on every platform)
  unrs-resolver: false

blockExoticSubdeps: true

trustPolicy: no-downgrade

trustPolicyExclude:
  # Maintainer published 4.0.2/4.0.3 locally (no provenance); tarball matches upstream tag, no advisories
  - chokidar@4.0.3
  # Backport of the ReDoS fix to the 6.x line, published without provenance; tarball identical to upstream tag v6.3.1
  - semver@6.3.1
  # Maintainer arcanis published 3.2.2 by hand (no provenance); tarball matches upstream berry 2eb98307, no advisories
  - "@yarnpkg/libzip@3.2.2"

strictDepBuilds: true

strictPeerDependencies: false

overrides:
  # Each entry lifts a vulnerable range to its fixed release on the same major, whatever pulls it,
  # so it survives parent upgrades and matches nothing once no vulnerable copy is left.
  # @babel/plugin-transform-modules-systemjs advisory group (Nx preset-env).
  "@babel/plugin-transform-modules-systemjs@>=7 <7.29.4": ^7.29.4
  # brace-expansion 2 and 5 advisory groups (minimatch).
  "brace-expansion@>=2 <2.1.6": ^2.1.6
  "brace-expansion@>=5 <5.0.12": ^5.0.12
  # browserslist advisory groups (Babel compilation targets, core-js-compat).
  "browserslist@>=4 <4.28.7": ^4.28.7
  # Express request parsing, proxy address and compression advisory groups (React Router serve).
  "body-parser@>=2 <2.4.0": ^2.4.0
  "compression@>=1 <1.8.2": ^1.8.2
  "proxy-addr@>=2 <2.0.8": ^2.0.8
  # defu advisory group (Vinxi, SolidStart).
  "defu@>=6 <6.1.7": ^6.1.7
  # devalue advisory groups (Svelte, SvelteKit).
  "devalue@>=5 <5.9.4": ^5.9.4
  # fast-uri advisory groups (Ajv).
  "fast-uri@>=3 <3.1.7": ^3.1.7
  # follow-redirects advisory groups (Vinxi HTTP proxy).
  "follow-redirects@>=1 <1.16.2": ^1.16.2
  # h3 advisory groups (Vinxi server, listeners, storage); owner-approved past Vinxi's exact pin.
  "h3@>=1 <1.15.11": ~1.15.11
  # js-yaml advisory groups (cosmiconfig).
  "js-yaml@>=4 <4.3.2": ^4.3.2
  # minimatch 5 and 9 advisory groups (archive file matching).
  "minimatch@>=5 <5.1.8": ^5.1.8
  "minimatch@>=9 <9.0.9": ^9.0.9
  # serialize-javascript advisory group: Nitro 2.13.2 moves the Terser plugin to serializer 7.
  "nitropack@>=2 <2.13.2": ^2.13.2
  # node-forge advisory groups (Vinxi and Nitro TLS tooling).
  "node-forge@>=1 <1.4.3": ^1.4.3
  # picomatch 2 advisory groups (anymatch, micromatch).
  "picomatch@>=2 <2.3.2": ^2.3.2
  # seroval advisory groups (SolidStart), kept on the 1.6 line Solid JS 1.9.18 expects.
  "seroval@>=1 <1.6.12": ~1.6.12
  "seroval-plugins@>=1 <1.6.12": ~1.6.12
  # source-map-js advisory group (Tailwind, css-tree).
  "source-map-js@>=1 <1.2.2": ^1.2.2
  # tar advisory groups (Nitro native dependency tracing).
  "tar@>=7 <7.5.21": ^7.5.21
  # undici 6, 7 and 8 advisory groups (Actions clients, Nx, Testcontainers); 7 is owner-approved past Nx's exact pin.
  "undici@>=6 <6.29.1": ^6.29.1
  "undici@>=7 <7.30.2": ^7.30.2
  "undici@>=8 <8.12.2": ^8.12.2
  # Vite 6 advisory group (Vinxi bundler). Scoped to the Vinxi 0.5 line: a bare vite range
  # would also capture multi-major peer ranges such as "^6 || ^7 || ^8" and downgrade Vite 8.
  "vinxi@0.5>vite": ~6.4.6
  # zod 4 advisory group (Vinxi, Stryker mutation protocol); zod 3 is an Accepted advisory.
  # Scoped by parent line: a bare zod range would rewrite "^3.25.0 || ^4.0.0" peer ranges.
  "mutation-server-protocol@0>zod": ^4.6.6
  "vinxi@0.5>zod": ^4.6.6

catalog:
  "@arethetypeswrong/cli": 0.18.5
  "@codecov/rollup-plugin": 2.0.1
  "@codecov/vite-plugin": 2.0.1
  "@stryker-mutator/api": 10.1.1
  "@stryker-mutator/core": 10.1.1
  "@stryker-mutator/typescript-checker": 10.1.1
  "@stryker-mutator/vitest-runner": 10.1.1
  "@testcontainers/postgresql": 12.2.0
  "@testcontainers/redis": 12.2.0
  "@types/node": 24.19.2
  "@types/pg": 8.20.0
  "@types/react": 19.2.17
  "@varlock/1password-plugin": 2.0.4
  "@varlock/vite-integration": 1.5.2
  "@vitejs/plugin-react-swc": 4.3.3
  "@vitest/browser-playwright": 5.1.0
  "@vitest/coverage-v8": 5.1.0
  "@vitest/eslint-plugin": 1.6.28
  "@vitest/ui": 5.1.0
  drizzle-kit: 0.31.10
  drizzle-orm: 0.45.2
  inversify: 8.2.3
  ioredis: 5.11.1
  msw: 3.0.4
  neverthrow: 8.2.0
  pg: 8.22.0
  react: 19.2.7
  react-dom: 19.2.7
  solid-js: 1.9.18
  tsdown: 0.22.9
  tslib: 2.8.1
  typescript: 6.0.3
  varlock: 1.21.0
  vite: 8.3.4
  vite-plugin-solid: 2.11.12
  vitest: 5.1.0
  vitest-browser-react: 2.3.0

minimumReleaseAge: 1440

patchedDependencies:
  "@codecov/sveltekit-plugin@2.0.1": patches/@codecov__sveltekit-plugin@2.0.1.patch

permissions:
  fallow:
    skills: true
  varlock:
    skills: true
minimumReleaseAgeExclude:
  # Renovate security update: react-router@8.3.0
  - react-router@8.3.0
  # Renovate security update: zod@4.6.6
  - zod@4.6.6

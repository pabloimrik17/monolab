# Must-match version-group registry
#
# Authoritative, extensible list of package families that MUST resolve to a
# single shared version. This is a scan-SIDE input read by the scan-npm-updates
# skill itself (unlike `data/pkg-upgrade-overrides.yaml`, which is a
# command-side artifact the skill never reads). Reading this file keeps the
# skill read-only — it is config, not a mutation.
#
# TWO consumers, ONE source of truth:
#
#   1. scan-npm-updates — "Must-match version-group coherence": after
#      per-record resolution, every family with >=2 members that have
#      candidates is reconciled to the greatest age-eligible version that ALL
#      members publish and that sits within each member's level band; if no
#      such common version exists above current, the whole group is held back
#      rather than split. Members moved/held by the group carry
#      `clampedTo.rule = "version-group"`.
#
#   2. partition-breaking-changes — seeds its HARD co-upgrade sets from these
#      families (single source of truth; no separate hardcoded list). It still
#      augments with the override-registry families and a `peerDependencies`
#      read for looser co-upgrade relationships.
#
# Entry fields:
#
#   id       (string, required) stable identifier for the family.
#   matches  (list of strings, required, non-empty) glob patterns over package
#            names. `*` matches any run of characters WITHIN a name — same
#            semantics as the override registry — so `@vitest/*` matches
#            `@vitest/browser`, `@vitest/ui`, etc. No other glob metacharacters.
#
# WHAT BELONGS HERE: only families whose members genuinely release in lockstep
# on the SAME version (e.g. `@vitest/*` all publish `4.1.9`). Do NOT add
# co-upgrade-but-independent-version pairs (e.g. `typescript` + `tslib`,
# `jest` + `@types/jest`) — the must-match rule would never find a common
# version for them and would permanently hold the group back. Those looser
# relationships belong to partition-breaking-changes' peerDependencies read.
#
# Matching is first-win: a package matches at most one family, the first in
# declaration order whose `matches` patterns coincide.
#
# Adding a new family = append an entry here; both consumers pick it up with no
# code/command change.

groups:
    - id: react
      # react + react-dom + react-is publish in lockstep; @types/react tracks
      # the same major and is co-upgraded with the runtime (per the PR-grouping
      # spec). NOTE: @types/react uses its own patch line, so a scan where both
      # the runtime and the types have independent candidates may hold the
      # group back (accepted over-hold — surfaced via clampedTo/skippedByReleaseAge).
      matches:
          - react
          - react-dom
          - react-is
          - "@types/react"
          - "@types/react-dom"

    - id: vue
      matches:
          - vue
          - "@vue/*"

    - id: angular
      matches:
          - "@angular/*"

    - id: storybook
      matches:
          - storybook
          - "@storybook/*"
          - eslint-plugin-storybook
          - "storybook-addon-*"

    - id: vitest
      # The #247 family: vitest and every @vitest/* package release together on
      # one version (e.g. 4.1.9). Splitting them ("mixed versions not supported")
      # is exactly the failure this registry prevents.
      matches:
          - vitest
          - "@vitest/*"

# Codecov Configuration for MonoLab Monorepo
# Documentation: https://docs.codecov.com/docs/codecov-yaml

# Coverage status checks
coverage:
    status:
        # Project coverage (overall repository)
        project:
            default:
                target: auto # Maintain current coverage level
                threshold: 2% # Allow up to 2% coverage decrease (strict but reasonable)
                informational: false # Block PRs if coverage drops significantly

            # Per-package project coverage checks
            react-hooks:
                target: auto
                threshold: 2%
                informational: false
                flags:
                    - react-hooks

            react-clean:
                target: auto
                threshold: 2%
                informational: false
                flags:
                    - react-clean

            ts-types:
                target: auto
                threshold: 2%
                informational: false
                flags:
                    - ts-types

            drizzle-neverthrow:
                target: auto
                threshold: 2%
                informational: false
                flags:
                    - drizzle-neverthrow

            http-client:
                target: auto
                threshold: 2%
                informational: false
                flags:
                    - http-client

            qup-api:
                target: auto
                threshold: 2%
                informational: false
                flags:
                    - qup-api

            qup-data:
                target: auto
                threshold: 2%
                informational: false
                flags:
                    - qup-data

            qup-domain:
                target: auto
                threshold: 2%
                informational: false
                flags:
                    - qup-domain

            solid-clean:
                target: auto
                threshold: 2%
                informational: false
                flags:
                    - solid-clean

            investlab-core:
                target: auto
                threshold: 2%
                informational: false
                flags:
                    - investlab-core

            investlab-quotes:
                target: auto
                threshold: 2%
                informational: false
                flags:
                    - investlab-quotes

            investlab-portfolio:
                target: auto
                threshold: 2%
                informational: false
                flags:
                    - investlab-portfolio

            green-beard:
                target: auto
                threshold: 2%
                informational: false
                flags:
                    - green-beard

            qup-web:
                target: auto
                threshold: 2%
                informational: false
                flags:
                    - qup-web

            investlab:
                target: auto
                threshold: 2%
                informational: false
                flags:
                    - investlab

            investlab-api:
                target: auto
                threshold: 2%
                informational: false
                flags:
                    - investlab-api

            qup-shared:
                target: auto
                threshold: 2%
                informational: false
                flags:
                    - qup-shared

            plugin-experiments:
                target: auto
                threshold: 2%
                informational: false
                flags:
                    - plugin-experiments

        # Patch coverage (new/modified code in PRs)
        patch:
            default:
                target: 80%
                threshold: 0%
                informational: false # Block PRs with very low coverage on new code

            # Per-package patch coverage checks
            react-hooks:
                target: 80%
                threshold: 0%
                informational: false
                flags:
                    - react-hooks

            react-clean:
                target: 80%
                threshold: 0%
                informational: false
                flags:
                    - react-clean

            ts-types:
                target: 80%
                threshold: 0%
                informational: false
                flags:
                    - ts-types

            drizzle-neverthrow:
                target: 80%
                threshold: 0%
                informational: false
                flags:
                    - drizzle-neverthrow

            http-client:
                target: 80%
                threshold: 0%
                informational: false
                flags:
                    - http-client

            qup-api:
                target: 80%
                threshold: 0%
                informational: false
                flags:
                    - qup-api

            qup-data:
                target: 80%
                threshold: 0%
                informational: false
                flags:
                    - qup-data

            qup-domain:
                target: 80%
                threshold: 0%
                informational: false
                flags:
                    - qup-domain

            solid-clean:
                target: 80%
                threshold: 0%
                informational: false
                flags:
                    - solid-clean

            investlab-core:
                target: 80%
                threshold: 0%
                informational: false
                flags:
                    - investlab-core

            investlab-quotes:
                target: 80%
                threshold: 0%
                informational: false
                flags:
                    - investlab-quotes

            investlab-portfolio:
                target: 80%
                threshold: 0%
                informational: false
                flags:
                    - investlab-portfolio

            green-beard:
                target: 80%
                threshold: 0%
                informational: false
                flags:
                    - green-beard

            qup-web:
                target: 80%
                threshold: 0%
                informational: false
                flags:
                    - qup-web

            investlab:
                target: 80%
                threshold: 0%
                informational: false
                flags:
                    - investlab

            investlab-api:
                target: 80%
                threshold: 0%
                informational: false
                flags:
                    - investlab-api

            qup-shared:
                target: 80%
                threshold: 0%
                informational: false
                flags:
                    - qup-shared

            plugin-experiments:
                target: 80%
                threshold: 0%
                informational: false
                flags:
                    - plugin-experiments

# Files and directories to ignore from coverage calculations
ignore:
    - "**/*.spec.ts"
    - "**/*.test.ts"
    - "**/*.spec.tsx"
    - "**/*.test.tsx"
    - "**/dist/"
    - "**/node_modules/"
    - "**/coverage/"
    - "**/.nx/"
    - "**/*.config.ts"
    - "**/*.config.tsx"
    - "**/*.config.js"
    - "**/*.config.cjs"
    - "**/*.config.mjs"
    - "**/vite.config.ts"
    - "**/vitest.config.ts"
    - "**/vitest.setup.ts"
    - "**/eslint.config.ts"
    - "**/stryker.config.*"
    - "**/tsdown.config.*"
    - "**/drizzle.config.*"
    - "**/setup.ts"

# Enable inline annotations on pull requests
comment:
    layout: "header, diff, flags, files, footer"
    behavior: default # Update existing comment
    require_changes: false # Always comment, even if no coverage changes

# Per-package flags for independent tracking
flags:
    react-hooks:
        paths:
            - packages/react-hooks/
        carryforward: true # Use previous coverage if not in current upload

    react-clean:
        paths:
            - packages/react-clean/
        carryforward: true

        paths:
            - packages/ts-types/
        carryforward: true

    http-client:
        paths:
            - packages/http-client/
        carryforward: true

    drizzle-neverthrow:
        paths:
            - packages/drizzle-neverthrow/
        carryforward: true

    qup-api:
        paths:
            - apps/qup-api/
        carryforward: true

    qup-data:
        paths:
            - packages/qup-data/
        carryforward: true

    qup-domain:
        paths:
            - packages/qup-domain/
        carryforward: true

    solid-clean:
        paths:
            - packages/solid-clean/
        carryforward: true

    investlab-core:
        paths:
            - packages/investlab-core/
        carryforward: true

    investlab-quotes:
        paths:
            - packages/investlab-quotes/
        carryforward: true

    investlab-portfolio:
        paths:
            - packages/investlab-portfolio/
        carryforward: true

    green-beard:
        paths:
            - apps/green-beard/
        carryforward: true

    qup-web:
        paths:
            - apps/qup-web/
        carryforward: true

    investlab:
        paths:
            - apps/investlab/
        carryforward: true

    investlab-api:
        paths:
            - apps/investlab-api/
        carryforward: true

    qup-shared:
        paths:
            - packages/qup-shared/
        carryforward: true

    plugin-experiments:
        paths:
            - claude-plugins/experiments/
        carryforward: true

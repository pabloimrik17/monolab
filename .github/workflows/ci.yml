name: CI

on:
    push:
        branches:
            - main
            - pre
            - develop
    pull_request: {}

# Needed for nx-set-shas when run on the main branch
permissions:
    actions: read
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            # fallow audit posts a sticky PR comment + native Check Run
            pull-requests: write
            checks: write
        env:
            NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  filter: tree:0
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Nodejs
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc

            - name: Set Nx SHA
              uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

            - name: Restore cached npm dependencies
              id: cache-dependencies-restore
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules
                  key: npm-dependencies-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      npm-dependencies-${{ runner.os }}-${{ github.ref_name }}-
                      npm-dependencies-${{ runner.os }}-develop-
                      npm-dependencies-${{ runner.os }}-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Cache npm dependencies
              id: cache-dependencies-save
              if: ${{ steps.cache-dependencies-restore.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules
                  key: ${{ steps.cache-dependencies-restore.outputs.cache-primary-key }}

            # The whole .nx is cached so the cache index in .nx/workspace-data travels with
            # the entries. Every job uses its own key per commit: cache entries are immutable,
            # so a fixed key would never refresh, and a shared one would let jobs overwrite
            # each other.
            - name: Restore Nx cache
              id: cache-nx-restore
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .nx
                  key: nx-${{ runner.os }}-lint-${{ github.ref_name }}-${{ github.sha }}
                  restore-keys: |
                      nx-${{ runner.os }}-lint-${{ github.ref_name }}-
                      nx-${{ runner.os }}-lint-develop-

            - name: 🔍 Check monorepo integrity
              run: pnpm exec nx sync:check

            - name: 🔍 Check exports from packages
              run: pnpm exec nx run-many -t build:check-exports

            - name: 🔍 Check for format and lint configs are valid
              run: pnpm exec nx run-many -t lint:eslint:config-check lint:stylelint:config-check:scss

            - name: 🔍 Check legacy tests
              run: pnpm exec nx run-many -t lint:legacy-tests

            - name: 🔍 Validate OpenSpec change proposals
              run: pnpm dlx @fission-ai/openspec@1.2.0 validate --changes --no-interactive

            - name: 🔍 Execute lint checks for affected files (Affected)
              run: pnpm exec nx affected -t lint:eslint lint:stylelint lint:markdownlint lint:oxfmt && pnpm run lint:knip
              if: ${{ github.event_name == 'pull_request' }}

            - name: 🔍 Fallow audit (changed-code quality gate)
              # actions-up-ignore-next-line
              uses: fallow-rs/fallow@71369f80d099e25726ad04382f15aef14a251abc # v3.31.0
              with:
                  command: audit
                  comment: true
              if: ${{ github.event_name == 'pull_request' }}

            - name: 🔍 Execute lint checks for all files (All)
              run: pnpm exec nx run-many -t lint:publint lint:knip lint:eslint lint:stylelint lint:markdownlint lint:oxfmt lint:fallow
              if: ${{ github.event_name == 'push' }}

            - name: Cache Nx results
              id: cache-nx-save
              if: ${{ !cancelled() }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .nx
                  key: ${{ steps.cache-nx-restore.outputs.cache-primary-key }}

    tests:
        runs-on: ubuntu-latest
        env:
            NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        outputs:
            # JSON array of { name, path } objects — the upload-codecov matrix is built
            # from this. PR: only affected packages; push: all packages. Empty ([]) when
            # no covered package is affected, which skips the upload-codecov job entirely.
            matrix: ${{ steps.affected-codecov.outputs.matrix }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  filter: tree:0
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Nodejs
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc

            - name: Set Nx SHA
              uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

            - name: Restore cached npm dependencies
              id: cache-dependencies-restore
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules
                  key: npm-dependencies-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      npm-dependencies-${{ runner.os }}-${{ github.ref_name }}-
                      npm-dependencies-${{ runner.os }}-develop-
                      npm-dependencies-${{ runner.os }}-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Cache npm dependencies
              id: cache-dependencies-save
              if: ${{ steps.cache-dependencies-restore.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules
                  key: ${{ steps.cache-dependencies-restore.outputs.cache-primary-key }}

            # Browser-mode vitest tests need Chromium.
            - name: Get Playwright version
              id: playwright-version
              run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              id: cache-playwright
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

            - name: Install Playwright Chromium
              if: ${{ steps.cache-playwright.outputs.cache-hit != 'true' }}
              run: pnpm exec playwright install --with-deps chromium

            - name: Install Playwright system dependencies
              if: ${{ steps.cache-playwright.outputs.cache-hit == 'true' }}
              run: pnpm exec playwright install-deps chromium

            - name: Restore Nx cache
              id: cache-nx-restore
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .nx
                  key: nx-${{ runner.os }}-tests-${{ github.ref_name }}-${{ github.sha }}
                  restore-keys: |
                      nx-${{ runner.os }}-tests-${{ github.ref_name }}-
                      nx-${{ runner.os }}-tests-develop-

            - name: 🧪 Execute test coverage checks for affected files (Affected)
              run: pnpm exec nx affected -t test:coverage
              if: ${{ github.event_name == 'pull_request' }}

            - name: 🧪 Execute test coverage checks for all files (All)
              run: pnpm exec nx run-many -t test:coverage
              if: ${{ github.event_name == 'push' }}

            - name: 🔍 Execute type checks for affected files (Affected)
              run: pnpm exec nx affected -t typecheck
              if: ${{ github.event_name == 'pull_request' }}

            - name: 🔍 Execute type checks for all files (All)
              run: pnpm exec nx run-many -t typecheck
              if: ${{ github.event_name == 'push' }}

            # Build the upload-codecov matrix dynamically.
            # PR: only affected packages get a matrix entry, so a PR that touches no
            # covered package (e.g. plugin/skill/docs/openspec/CI-only) yields an empty
            # matrix and the upload-codecov job is skipped — instead of failing on a
            # missing coverage artifact. Push: all packages (full baseline run).
            - name: 🔍 Detect affected packages for Codecov
              id: affected-codecov
              run: |
                  # name:path pairs — single source of truth for the upload-codecov matrix.
                  PACKAGES="react-hooks:packages/react-hooks react-clean:packages/react-clean ts-types:packages/ts-types http-client:packages/http-client drizzle-neverthrow:packages/drizzle-neverthrow qup-api:apps/qup-api qup-data:packages/qup-data qup-domain:packages/qup-domain solid-clean:packages/solid-clean investlab-core:packages/investlab-core investlab-quotes:packages/investlab-quotes investlab-portfolio:packages/investlab-portfolio green-beard:apps/green-beard qup-web:apps/qup-web investlab:apps/investlab investlab-api:apps/investlab-api qup-shared:packages/qup-shared plugin-experiments:claude-plugins/experiments"

                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    AFFECTED_PROJECTS=$(pnpm exec nx show projects --affected)
                    echo "Affected projects:"
                    echo "$AFFECTED_PROJECTS"
                  fi

                  MATRIX="[]"
                  for entry in $PACKAGES; do
                    name="${entry%%:*}"
                    path="${entry#*:}"
                    if [ "${{ github.event_name }}" = "pull_request" ]; then
                      if echo "$AFFECTED_PROJECTS" | grep -Fxq "@m0n0lab/$name"; then
                        echo "✓ $name is affected"
                      else
                        echo "⏭️  $name is not affected"
                        continue
                      fi
                    fi
                    MATRIX=$(echo "$MATRIX" | jq -c --arg n "$name" --arg p "$path" '. + [{name: $n, path: $p}]')
                  done

                  echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
                  echo "Matrix: $MATRIX"

            # Upload lcov + junit artifacts for the downstream matrix job to consume.
            # Single small artifact (<2MB typically); retention 1 day is enough for the
            # follow-up job to download.
            - name: 📦 Upload coverage artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: ${{ !cancelled() }}
              with:
                  name: codecov-artifacts
                  path: |
                      packages/*/coverage/lcov.info
                      apps/*/coverage/lcov.info
                      claude-plugins/*/coverage/lcov.info
                      packages/*/test-results.junit.xml
                      apps/*/test-results.junit.xml
                      claude-plugins/*/test-results.junit.xml
                  if-no-files-found: warn
                  retention-days: 1

            - name: Cache Nx results
              id: cache-nx-save
              if: ${{ !cancelled() }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .nx
                  key: ${{ steps.cache-nx-restore.outputs.cache-primary-key }}

    build:
        runs-on: ubuntu-latest
        env:
            NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  filter: tree:0
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Nodejs
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc

            - name: Set Nx SHA
              uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

            - name: Restore cached npm dependencies
              id: cache-dependencies-restore
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules
                  key: npm-dependencies-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      npm-dependencies-${{ runner.os }}-${{ github.ref_name }}-
                      npm-dependencies-${{ runner.os }}-develop-
                      npm-dependencies-${{ runner.os }}-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Cache npm dependencies
              id: cache-dependencies-save
              if: ${{ steps.cache-dependencies-restore.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules
                  key: ${{ steps.cache-dependencies-restore.outputs.cache-primary-key }}

            # Browser-mode Stryker runs need Chromium.
            - name: Get Playwright version
              id: playwright-version
              run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              id: cache-playwright
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

            - name: Install Playwright Chromium
              if: ${{ steps.cache-playwright.outputs.cache-hit != 'true' }}
              run: pnpm exec playwright install --with-deps chromium

            - name: Install Playwright system dependencies
              if: ${{ steps.cache-playwright.outputs.cache-hit == 'true' }}
              run: pnpm exec playwright install-deps chromium

            - name: Restore Nx cache
              id: cache-nx-restore
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .nx
                  key: nx-${{ runner.os }}-build-${{ github.ref_name }}-${{ github.sha }}
                  restore-keys: |
                      nx-${{ runner.os }}-build-${{ github.ref_name }}-
                      nx-${{ runner.os }}-build-develop-

            - name: Restore Stryker incremental cache
              id: cache-stryker-restore
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: packages/*/reports/stryker-incremental.json
                  key: stryker-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      stryker-${{ runner.os }}-${{ github.ref_name }}-
                      stryker-${{ runner.os }}-develop-
                      stryker-${{ runner.os }}-

            - name: 🏗 Execute build checks
              # Builds all packages; Nx cache optimizes by skipping rebuild of non-affected packages.
              # CODECOV_TOKEN is propagated so app bundler plugins (@codecov/vite-plugin,
              # @codecov/sveltekit-plugin, @codecov/rollup-plugin) upload bundle stats during build.
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
              run: pnpm exec nx run-many -t build

            - name: 📦 Analyze and upload bundle sizes to Codecov
              continue-on-error: true
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
              run: |
                  # Analyze each published package
                  # Note: nx run-many with Nx cache avoids redundant rebuilds of non-affected packages
                  for package in react-hooks react-clean ts-types http-client drizzle-neverthrow solid-clean qup-shared; do
                    if [ -d "packages/$package/dist" ]; then
                      echo "📦 Analyzing bundle for $package..."
                      pnpm exec bundle-analyzer packages/$package/dist \
                        --bundle-name="$package" \
                        --upload-token="$CODECOV_TOKEN"
                    else
                      echo "⚠️  Skipping $package: dist directory not found"
                    fi
                  done

            - name: 🧬 Execute mutation testing (Affected)
              # --parallel=1: browser-mode Stryker runs fail when they overlap on one runner.
              run: pnpm exec nx affected -t test:mutation --parallel=1
              if: ${{ github.event_name == 'pull_request' }}

            - name: 🧬 Execute mutation testing (All)
              # --parallel=1: browser-mode Stryker runs fail when they overlap on one runner.
              run: pnpm exec nx run-many -t test:mutation --parallel=1
              if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
              env:
                  STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}

            - name: Cache Stryker incremental results
              id: cache-stryker-save
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
              with:
                  path: packages/*/reports/stryker-incremental.json
                  key: ${{ steps.cache-stryker-restore.outputs.cache-primary-key }}

            - name: 📊 Upload mutation reports as artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
              with:
                  name: mutation-reports
                  path: packages/*/reports/mutation
                  retention-days: 30

            - name: Cache Nx results
              id: cache-nx-save
              if: ${{ !cancelled() }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .nx
                  key: ${{ steps.cache-nx-restore.outputs.cache-primary-key }}

    # The branch-protection ruleset requires one check named `main`; this job keeps that
    # name whatever the job layout above.
    main:
        needs: [lint, tests, build]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: ✅ Require lint, tests and build to pass
              run: |
                  echo "lint: ${{ needs.lint.result }}"
                  echo "tests: ${{ needs.tests.result }}"
                  echo "build: ${{ needs.build.result }}"
                  if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
                    exit 1
                  fi

    # Fan-out coverage + test-results uploads to Codecov.
    # The matrix is built dynamically by the `tests` job from the affected packages, so a
    # PR that touches no covered package produces an empty matrix and this job is skipped
    # (instead of failing on a missing coverage artifact). Single source of truth for the
    # package list: the `affected-codecov` step in the `tests` job.
    upload-codecov:
        needs: tests
        if: ${{ !cancelled() && needs.tests.outputs.matrix != '' && needs.tests.outputs.matrix != '[]' }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                package: ${{ fromJson(needs.tests.outputs.matrix) }}
        steps:
            - name: Download coverage artifacts
              # Tolerate a missing artifact: an affected package that produced no coverage
              # report would otherwise hard-fail the job. The uploads below no-op on a
              # missing file (fail_ci_if_error: false), keeping the run green.
              continue-on-error: true
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: codecov-artifacts

            - name: 📊 Upload coverage to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              if: ${{ !cancelled() }}
              with:
                  files: ./${{ matrix.package.path }}/coverage/lcov.info
                  flags: ${{ matrix.package.name }}
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: false

            - name: 📊 Upload test results to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              if: ${{ !cancelled() }}
              with:
                  files: ./${{ matrix.package.path }}/test-results.junit.xml
                  flags: ${{ matrix.package.name }}
                  report_type: test_results
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: false

name: Validate Renovate config

on:
    pull_request:
        paths:
            - "renovate.json"
            - "renovate.json5"
            - ".renovaterc"
            - ".renovaterc.json"
            - ".renovaterc.json5"
            - ".github/renovate.json"
            - ".github/renovate.json5"

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

            - name: Setup Nodejs
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc

            # renovate >= 43.221.0 requires pnpm 11; this repo uses pnpm 10, so the
            # pinned version is capped via allowedVersions in renovate.json.
            - name: Validate Renovate config
              run: pnpm dlx --package renovate@43.220.0 renovate-config-validator --strict renovate.json

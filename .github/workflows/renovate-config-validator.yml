name: Validate Renovate config

on:
    pull_request:
        paths:
            - "renovate.json"
            - "renovate.json5"
            - ".renovaterc"
            - ".renovaterc.json"
            - ".renovaterc.json5"
            - ".github/renovate.json"
            - ".github/renovate.json5"

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Setup pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
              with:
                  version: 10.27.0

            - name: Setup Nodejs
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24.12.0

            # renovate >= 43.221.0 requires pnpm 11; this repo uses pnpm 10, so the
            # pinned version is capped via allowedVersions in renovate.json.
            - name: Validate Renovate config
              run: pnpm dlx --package renovate@43.220.0 renovate-config-validator --strict renovate.json
